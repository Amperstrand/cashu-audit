name: nightly-corpus

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '18 12 * * *'  # TEMP: capture a schedule-event run as landing evidence (issue #49 era); remove after first firing
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the token corpus (OpenTollGate/tollgate)
        uses: actions/checkout@v4
        with:
          repository: OpenTollGate/tollgate
          path: corpus-repo

      - name: Checkout the portal (vendored-corpus suite)
        uses: actions/checkout@v4
        with:
          repository: OpenTollGate/tollgate-captive-portal-site
          path: portal-repo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cdk-cli build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cdk-target
          key: cdk-cli-v0.18.1-${{ runner.os }}

      - name: Build cdk-cli 0.18.1 (primary reference wallet)
        run: |
          git clone --depth 1 --branch v0.18.1 https://github.com/cashubtc/cdk.git cdk-src
          cd cdk-src && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/cdk-target cargo build -p cdk-cli --release
          mkdir -p "$HOME/.local/bin" && ln -sf "$GITHUB_WORKSPACE/cdk-target/release/cdk-cli" "$HOME/.local/bin/cdk-cli"

      - name: Install nutshell (secondary reference wallet)
        # marshmallow<4: cashu 0.21.0's environs 9.5.0 is incompatible with
        # marshmallow 4.x (`ma.__version_info__` removed) — unpinned installs
        # broke the first nightly run; this pin matches the verified venv.
        run: pip install "cashu==0.21.0" "marshmallow<4"

      - name: Install runner dependencies
        run: pip install -r conformance/requirements.txt

      - name: Corpus self-validation
        run: python3 corpus-repo/corpus/validate.py

      - name: Portal node_modules (vendored-corpus suite needs them in-runner too)
        working-directory: portal-repo
        run: npm ci --silent

      - name: Run consumer-conformance lanes (offline decode + portal)
        run: |
          python3 conformance/consumer_conformance.py \
            --corpus corpus-repo/corpus \
            --cdk-cli "$HOME/.local/bin/cdk-cli" \
            --cashu "$(command -v cashu)" \
            --portal portal-repo \
            --lane lifecycle,portal \
            --report-out "reports/nightly-$(date -u +%Y-%m-%d).json"

      - name: Portal vendored-corpus suite (independent leg)
        working-directory: portal-repo
        run: |
          npm ci --silent
          npx vitest run tests/unit/corpus-conformance.test.js

      - name: Divergence gate (dedupe by REGKEY; bootstrap records baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 conformance/nightly_diff.py \
            --report "reports/nightly-$(date -u +%Y-%m-%d).json" \
            --baseline conformance/nightly-baseline.json \
            --file || echo "GATE_RC=$?" >> "$GITHUB_ENV"

      - name: Update STATUS page
        run: |
          python3 conformance/render_status.py --out conformance/NIGHTLY-STATUS.md

      - name: Commit baseline + STATUS (auto-generated state)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nightly-corpus bot"
          git config user.email "actions@users.noreply.github.com"
          git add conformance/nightly-baseline.json conformance/NIGHTLY-STATUS.md
          git diff --cached --quiet && echo "no state change" || {
            git commit -q -m "nightly-corpus: baseline/status update $(date -u +%Y-%m-%d)"
            git push
          }
          [ -z "${GATE_RC:-}" ] || { echo "nightly gate flagged divergences (rc=$GATE_RC)"; exit "$GATE_RC"; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: reports/
          if-no-files-found: ignore

      - name: File pipeline-health issue on infra failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="nightly-corpus/pipeline-health"
          OPEN=$(gh issue list --repo Amperstrand/cashu-audit --state open --json title --limit 200 | jq -r '.[].title' | grep -c "$KEY" || true)
          if [ "$OPEN" = "0" ]; then
            BODY="The nightly pipeline itself failed (infra class — not a verdict divergence; the divergence gate files its own issues). Run: https://github.com/Amperstrand/cashu-audit/actions/runs/${{ github.run_id }} — this issue stays open across failures until the pipeline is green again; close it when a subsequent nightly passes."
            gh issue create --repo Amperstrand/cashu-audit \
              --title "[nightly-corpus] pipeline-health: $KEY (run ${{ github.run_id }} failed)" \
              --body "$BODY" || true
          else
            echo "pipeline-health issue already open — not duplicating"
          fi
