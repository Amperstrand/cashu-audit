name: no-disclosure-material
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail if disclosure-grade material is tracked
        run: |
          if git ls-files | grep -qE '^private/'; then
            echo "::error::material under private/ must not be tracked in this PUBLIC repo — push it to the cashu-audit-private mirror instead (directory names and .gitignore are not access control)"
            exit 1
          fi
