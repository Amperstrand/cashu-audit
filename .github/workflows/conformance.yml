name: Conformance

on:
  # Weekly schedule removed 2026-10-19 (issue #33): the live-mint lane ran
  # 2h20m/wk with ~100 skips ("quote never reached PAID") and FAILs dominated
  # by wrong frozen predictions (melt-quote-creation signature assertions) —
  # not actionable signal. Deterministic surface lives in nightly-corpus.
  # Manual dispatch stays for ad-hoc online runs; schedule returns with the
  # #33 rebuild (deterministic + artifact-only, per #34's closed design).
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r conformance/requirements.txt

      - name: Run conformance suite
        run: |
          cd conformance
          python run_matrix.py \
            --mint https://testnut.cashu.exchange \
            --mint https://rugs.cashu.exchange \
            --output reports/conformance-$(date +%Y%m%d).md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-reports
          path: conformance/reports/
