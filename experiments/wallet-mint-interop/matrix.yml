# PERMANENT experiment matrix — reference mints (cdk + nutshell) + cashu-cf
# This is the default matrix for all future runs.
# Edit temporarily for specific experiments, restore for production testing.
run_name: permanent-matrix
max_parallel: 4

mints:
  # Reference implementations (the real Cashu ecosystem)
  - {name: cdk-0.18.0, family: cdk, image: "cashubtc/mintd:0.18.0"}
  - {name: ns-0.20.3, family: nutshell, image: "cashubtc/nutshell:0.20.3"}
  # Our production mint (internal integration testing)
  - {name: testnut, family: url, url: "https://testnut.cashu.exchange"}

wallets:
  - {name: cashu-ts-v4, driver: node, image: "node:20-slim", install: "@cashu/cashu-ts@^4"}
  - name: nutshell-wallet-0.20.3
    driver: python
    image: "cashubtc/nutshell:0.20.3"
    install: "none"

flows: [mint_swap, p2pk_send_spend, htlc_receive, htlc_refund]
