run_name: production-001
max_parallel: 3

mints:
  # Production cashu-cf mints (the actual TollGate backends)
  - {name: testnut, family: url, url: "https://testnut.cashu.exchange"}
  - {name: nofee-testnut, family: url, url: "https://nofees.testnut.cashu.exchange"}
  # Reference mints for cross-implementation comparison
  - {name: ns-0.20.3, family: nutshell, image: "cashubtc/nutshell:0.20.3"}
  - {name: cdk-0.18.0, family: cdk, image: "cashubtc/mintd:0.18.0"}

wallets:
  - {name: cashu-ts-v4, driver: node, image: "node:20-slim", install: "@cashu/cashu-ts@^4"}
  - {name: cashu-ts-v3.5, driver: node, image: "node:20-slim", install: "@cashu/cashu-ts@3.5.0"}
  - {name: cashu-ts-v2.9, driver: node, image: "node:18-slim", install: "@cashu/cashu-ts@2.9.0"}
  - name: nutshell-wallet-0.20.3
    driver: python
    image: "cashubtc/nutshell:0.20.3"
    install: "none"

flows: [mint_swap, p2pk_send_spend, htlc_receive, htlc_refund]
